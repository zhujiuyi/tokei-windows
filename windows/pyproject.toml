[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tokei-windows"
version = "0.1.0"
description = "Windows desktop adaptation of Tokei"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.8",
  "keyring>=25",
  "psutil>=6.1",
]

[project.scripts]
tokei-windows = "tokei_windows.main:main"

[tool.setuptools]
packages = ["tokei_windows"]
include-package-data = true

[tool.setuptools.package-data]
tokei_windows = ["qml/*.qml", "pricing.json", "pricing_overrides.json"]
